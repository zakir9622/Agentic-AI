name: Android CI

# Runs when a pull request is *presented for review*, not on every commit pushed to it.
# Does NOT publish GitHub Releases — see release-apk.yml (main merges / pushes only).
#
# `synchronize` is deliberately absent from the trigger list. That is the event GitHub fires
# for every new commit on an open PR, and including it (the default when `types:` is omitted)
# meant a four-commit branch burned four full ~7-minute matrix runs — three of them on code
# that was still being iterated on. The full gate is meant to run against finished work.
#
# The intended loop: push commits freely to a **draft** PR, run the same checks locally
# (`./gradlew :composeApp:detekt :shared:testDebugUnitTest :composeApp:testSideloadDebugUnitTest
# :composeApp:lintSideloadDebug`), then click "Ready for review" — which fires `ready_for_review`
# and runs CI once against the finished branch. `workflow_dispatch` re-runs it on demand without
# needing an empty commit.
#
# `push: branches: [main]` is kept: post-merge validation of what actually landed is the one
# run that cannot be replaced by a local gate, and it is one run per merge, not per commit.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Static Kotlin quality baseline
        run: ./gradlew :composeApp:detekt

      - name: Bootstrap Python ML deps
        run: pip install onnxruntime numpy huggingface_hub onnx

      - name: Bootstrap debug lite pack if missing
        run: |
          if [ ! -f composeApp/src/debug/assets/packs/lite-v1/garment_seg.onnx ]; then
            python3 ml/export_lite_pack.py --out composeApp/src/debug/assets/packs/lite-v1
          fi

      - name: Verify lite pack assets
        run: bash scripts/verify-lite-pack.sh

      - name: Verify HF packs manifest
        run: python3 scripts/verify-manifest.py

      - name: Local model integration (bundled assets)
        run: python3 scripts/integration-local-models.py --skip-hf-download

      - name: Edge-case integration harness
        run: python3 scripts/integration-edge-cases.py

      - name: Local model benchmarks (smoke)
        run: python3 scripts/benchmark-local.py

      - name: ATR classify fixture harness (R2)
        run: python3 scripts/test_atr_classify.py

      - name: Unit tests
        run: ./gradlew :shared:testDebugUnitTest :composeApp:testSideloadDebugUnitTest

      - name: Render spatial UI visual fixtures
        run: ./gradlew :composeApp:testSideloadDebugUnitTest --tests com.zakir.vestra.ui.ScreenshotTest --rerun-tasks

      - name: Lint
        run: ./gradlew :composeApp:lintSideloadDebug

      - name: Assemble sideload debug APK
        run: ./gradlew :composeApp:assembleSideloadDebug

      - uses: actions/upload-artifact@v4
        with:
          name: vestra-debug-apk
          path: composeApp/build/outputs/apk/sideload/debug/*.apk
          retention-days: 14

      - name: Upload spatial UI visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-ui-visual-evidence
          path: composeApp/build/screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Kotlin static-quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-static-quality
          path: composeApp/build/reports/detekt/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Android lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-accessibility
          path: composeApp/build/reports/lint-results-*
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-benchmark-json
          path: |
            /tmp/lookbook-benchmark-local.json
            /tmp/lookbook-benchmark-cloud.json
          retention-days: 7
          if-no-files-found: ignore
