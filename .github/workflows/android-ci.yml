name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :shared:testDebugUnitTest :composeApp:testSideloadDebugUnitTest

      - name: Lint
        run: ./gradlew :composeApp:lintSideloadDebug

      - name: Assemble sideload debug APK
        run: ./gradlew :composeApp:assembleSideloadDebug

      - uses: actions/upload-artifact@v4
        with:
          name: vestra-debug-apk
          path: composeApp/build/outputs/apk/sideload/debug/*.apk
          retention-days: 14
