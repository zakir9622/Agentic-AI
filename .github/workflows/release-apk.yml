name: Release APK

# Builds an installable sideload release APK on every merge to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias lookbook \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lookbook -keypass lookbook \
            -dname "CN=The Lookbook, OU=Mobile, O=Vestra, L=Local, ST=NA, C=US"

      - name: Assemble sideload release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: lookbook
          KEY_ALIAS: lookbook
          KEY_PASSWORD: lookbook
        run: ./gradlew :composeApp:assembleSideloadRelease

      - name: Stage APK
        run: |
          mkdir -p dist
          cp composeApp/build/outputs/apk/sideload/release/*.apk \
            "dist/the-lookbook-sideload-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: the-lookbook-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish to rolling 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --target "${{ github.sha }}" \
            --title "The Lookbook — latest APK (build #${{ github.run_number }})" \
            --notes "Sideload release APK from \`main\` (${{ github.sha }}). Install on Pixel 9 / Android 8.0+. Download the Pro model pack from Model packs inside the app (~2–4 GB, one-time, fully offline after)." \
            "dist/the-lookbook-sideload-${{ github.run_number }}.apk"
